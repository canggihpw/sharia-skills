# GENERATED FILE — do not edit. Source: shared/references/thresholds.yaml. Run `npm run sync`.

# Shared screening thresholds for the sharia skills pack.
# This file is the single source of truth. Skills MUST read it rather than
# restating numbers in prose, so the pack cannot drift into self-contradiction.

meta:
  as_of: 2026-10-20
  verify_before_use: true
  notice: >
    These values summarise publicly published standards. Standards are revised,
    and some index methodologies are only partly public or are licensed. Re-verify
    against the current edition before issuing a real verdict, and cite the edition
    and date in the output. When a value is marked confidence: medium, say so.
  precedence:
    - client_mandate
    - local_regulator
    - chosen_index_provider
    - aaoifi_default
  verdict_vocabulary:
    - compliant
    - non_compliant
    - questionable
    - insufficient_data

non_permissible_activities:
  consensus:
    - conventional_banking
    - conventional_insurance
    - interest_based_lending
    - gambling_and_betting
    - alcohol_production_or_distribution
    - pork_and_derivatives
    - pornography
    - adult_entertainment
    - conventional_derivatives_trading
  disputed:
    - tobacco
    - weapons_and_defence
    - music_and_streaming
    - hotels_serving_alcohol
    - cinema
    - conventional_advertising
    - crypto_exchange
    - interest_income_below_threshold  # treated as impure, not disqualifying
  note: >
    A disputed line item is not a veto. Record it, apply the chosen standard's
    treatment, and surface the disagreement in the report.

standards:
  aaoifi:
    label: AAOIFI Shariah Standard No. 21 (financial paper, shares and similar)
    confidence: high
    financial_ratios:
      - id: non_permissible_revenue
        formula: non_permissible_revenue / total_revenue
        max: 0.05
        basis: revenue
      - id: interest_bearing_debt
        formula: interest_bearing_debt / market_cap
        max: 0.30
        basis: market_cap
        alt_basis: total_assets
        note: Some adopters apply the ratio to total assets instead of market cap.
      - id: cash_and_interest_securities
        formula: (cash + interest_bearing_securities) / total_assets
        max: 0.70
        basis: total_assets
    purification:
      basis: non_permissible_revenue / total_revenue
      applied_to: dividend

  dsn_mui:
    label: DSN-MUI Fatwa No. 80/2011 + POJK 8/2025 DES criteria
    confidence: high
    jurisdiction: Indonesia
    # The fatwa and the operative DES criteria differ. Report both, separately.
    financial_ratios:
      - id: interest_based_debt
        formula: interest_based_debt / total_assets
        max: 0.45
        basis: total_assets
        phase_in_max: 0.33
        phase_in: "45% -> 33% over up to 10 years (POJK 8/2025); confirm the current phase with OJK"
      - id: interest_based_debt_des_target
        formula: interest_based_debt / total_assets
        max: 0.33
        basis: total_assets
        status: phased_target
      - id: non_permissible_income
        formula: (interest_income + other_non_halal_income) / (operating_revenue + other_income)
        max: 0.05
        basis: revenue
        effective_from: 2026-04-25
        status: in_force
        note: POJK 8/2025 replaced the 10% cap from POJK 35/2017.
    purification:
      basis: non_permissible_income / total_revenue
      applied_to: dividend
    note: >
      Fatwa 80/2011 still states 45% debt and 10% interest income. The operative
      DES criteria under POJK 8/2025 set 5% non-halal income (in force 25 Apr 2026)
      and phase the debt cap from 45% down to 33%. Cite the fatwa and the POJK
      separately; never present 45% as the settled current cap. KPKS has also
      recommended adjusting the DES debt ratio, so re-check after each OJK update.

  msci_islamic:
    label: MSCI Islamic Index Series methodology
    confidence: medium
    financial_ratios:
      - id: total_debt
        formula: total_debt / total_assets
        max: 0.3333
      - id: cash_and_interest_securities
        formula: (cash + interest_bearing_securities) / total_assets
        max: 0.3333
      - id: receivables_and_cash
        formula: (accounts_receivable + cash) / total_assets
        max: 0.3333
      - id: non_permissible_revenue
        formula: non_permissible_revenue / total_revenue
        max: 0.05
    purification:
      basis: non_permissible_revenue / total_revenue
      applied_to: dividend

  djim:
    label: Dow Jones Islamic Market Index methodology
    confidence: medium
    financial_ratios:
      - id: total_debt
        formula: total_debt / avg_market_cap_24m
        max: 0.33
      - id: cash_and_interest_securities
        formula: (cash + interest_bearing_securities) / avg_market_cap_24m
        max: 0.33
      - id: accounts_receivable
        formula: accounts_receivable / avg_market_cap_24m
        max: 0.33
      - id: non_permissible_revenue_ex_interest
        formula: non_permissible_revenue_ex_interest / total_revenue
        max: 0.05
      - id: non_permissible_revenue_incl_interest
        formula: total_non_permissible_revenue / total_revenue
        max: 0.10
    purification:
      basis: non_permissible_revenue / total_revenue
      applied_to: dividend

  ftse_shariah:
    label: FTSE Shariah Global Equity Index Series
    confidence: medium
    financial_ratios:
      - id: total_debt
        formula: total_debt / total_assets
        max: 0.3333
      - id: cash_and_interest_securities
        formula: (cash + interest_bearing_securities) / total_assets
        max: 0.3333
      - id: receivables_and_cash
        formula: (accounts_receivable + cash) / total_assets
        max: 0.50
      - id: non_permissible_revenue
        formula: non_permissible_revenue / total_revenue
        max: 0.05
    purification:
      basis: non_permissible_revenue / total_revenue
      applied_to: dividend

  sc_malaysia_sac:
    label: Securities Commission Malaysia, Shariah Advisory Council
    confidence: medium
    jurisdiction: Malaysia
    activity_benchmarks:
      - tier: food_and_beverage
        max_non_permissible: 0.05
      - tier: general
        max_non_permissible: 0.20
    financial_ratios:
      - id: interest_bearing_debt
        formula: interest_bearing_debt / total_assets
        max: 0.33
    purification:
      basis: non_permissible_revenue / total_revenue
      applied_to: dividend

zakat_defaults:
  nisab_gold_grams: 85
  nisab_silver_grams: 595
  preferred_nisab: silver
  rate: 0.025
  hawl_days: 354
  note: >
    Jurisdictions and scholars differ on gold vs silver nisab. Silver is lower and
    therefore more inclusive; prefer it for cash and financial assets unless the
    user's local authority fixes a nisab. A local authority always overrides these
    defaults. Currency values are volatile — search for the current figure.
  indonesia:
    authority: BAZNAS
    decision: SK Ketua BAZNAS No. 15 Tahun 2026
    as_of: 2026-02-21
    basis: 85 g gold, 14 karat, 2025 average price
    nisab_idr_per_year: 91681728
    nisab_idr_per_month: 7640144
    rate: 0.025
    applies_to: zakat pendapatan dan jasa (gross income)
    note: >
      BAZNAS uses gold, not silver, for income zakat. This overrides the silver
      default for Indonesian users. The rupiah figure is reset annually.

budgeting_defaults:
  status: heuristic
  notice: >
    These are planning defaults, not fiqh rulings. Use them as starting points
    for a household allocation, label them as heuristic, and let a local
    authority, the household's actual obligations, or a scholar's guidance
    override them. Percentages are shares of net monthly income, not gross.
  basis: net_monthly_income
  authority_default: user_supplied_or_local_ulama
  nafkah_benchmark:
    source: user_supplied_or_local_authority
    note: >
      Do not hardcode a currency minimum for nafkah. Use a published local
      benchmark (for example a provincial minimum wage or a fatwa body's
      guidance) only as a dated reference point; the household's dependants and
      actual obligations set the floor.
  tiers:
    - id: syari_obligations
      label: Syar'i obligations
      degree: wajib
      floor: actual_obligation
      cap: null
      review_above_pct: 0.35
      note: >
        Zakat, support for parents, and halal debt instalments. Zakat is
        computed on wealth, not income; reserve the monthly accrual here and
        compute it with the zakat skill.
    - id: family_nafkah
      label: Family nafkah
      degree: wajib_fardhu_ain_husband
      floor_pct: 0.40
      cap_pct: 0.60
    - id: resilience
      label: Financial resilience
      degree: wajib_konseptual
      floor_pct: 0.10
      cap_pct: 0.20
      emergency_fund_months_floor: 3
      emergency_fund_months_target: 6
    - id: long_term_investment
      label: Long-term investment
      degree: sunnah_hajiyyat
      floor_pct: 0.05
      cap_pct: 0.30
    - id: infaq_and_worship
      label: Infaq and worship goals
      degree: sunnah
      floor_pct: 0.025
      cap_pct: 0.10
    - id: lifestyle
      label: Lifestyle and recreation
      degree: mubah
      floor_pct: 0.0
      cap_pct: 0.30
  spillover:
    order:
      - fill_any_under_floor
      - resilience
      - long_term_investment
      - infaq_and_worship
      - named_surplus_bucket
      - lifestyle_by_explicit_opt_in
    default_destination: long_term_investment
    note: >
      Surplus from a capped category moves down this order automatically. It
      must never be silently reabsorbed into lifestyle spending. If every
      destination is capped, park the surplus in a labelled unallocated bucket
      and surface it for a decision.
  spouse_isolation:
    default: majority_position
    wife_income_ownership: exclusive
    husband_nafkah_reduced_by_wife_income: false
    voluntary_contribution_label: ianah_or_sadaqah
    zakat_basis: separate_per_spouse
    note: >
      Presented as the majority position. Other arrangements are permissible by
      mutual consent; where the user reports one, record it as their chosen
      arrangement rather than correcting it.

allocation_defaults:
  status: heuristic
  notice: >
    Strategic asset allocation starting points, not a fatwa and not a
    recommendation. Percentages are point targets over total invested wealth
    and must sum to exactly 100%; tolerance bands are added on top. The user's
    mandate, horizon, and liquidity needs override these tiers.
  basis: total_invested_wealth
  band_method: absolute_pp
  absolute_band_pp: 0.05
  relative_band_pct: 0.25
  note: >
    Choose one band method and state it. The default is an absolute +/-5
    percentage points around each target. The relative alternative is +/-25% of
    the target weight. Do not mix the two in one plan.
  sleeves:
    - id: sharia_equities
      label: Sharia equities / Islamic index ETF
      role: growth
      liquidity: daily_to_weekly
      currency: follows_listing
      delegates_to:
        - sharia-fund-etf-review
        - sharia-stock-screening
    - id: sukuk
      label: Sukuk (retail, SNI, PBS, corporate)
      role: stability_and_income
      liquidity: hold_to_maturity_or_secondary
      currency: issuer_currency
      delegates_to:
        - sharia-sukuk-analysis
    - id: sharia_money_market
      label: Sharia money market / RDPU syariah
      role: liquidity_and_buffer
      liquidity: daily
      currency: fund_currency
      delegates_to:
        - sharia-fund-etf-review
    - id: gold
      label: Gold (physical or digital)
      role: inflation_and_geopolitical_hedge
      liquidity: physical_slower_than_digital
      currency: commodity
      delegates_to:
        - sharia-zakat-calc
    - id: crypto
      label: Crypto / BTC
      role: asymmetric_high_risk_sleeve
      liquidity: daily_but_volatile
      currency: usd_quoted
      delegates_to:
        - sharia-crypto-token-review
  tiers:
    - id: tier_0_pre_investment
      label: Pre-investment
      gate: emergency_fund_months_below
      gate_value: 3
      targets: null
      note: Build cash to the 3-month floor first; proposing risk assets before this gate is a defect.
    - id: tier_1_starter
      label: Starter
      keying: horizon_under_5y_or_invested_wealth_under_1x_annual_core_expenses
      targets:
        sharia_equities: 0.25
        sukuk: 0.15
        sharia_money_market: 0.40
        gold: 0.15
        crypto: 0.05
    - id: tier_2_growth
      label: Growth
      keying: horizon_5_to_10y_and_invested_wealth_1x_to_5x_annual_core_expenses
      targets:
        sharia_equities: 0.55
        sukuk: 0.20
        sharia_money_market: 0.10
        gold: 0.10
        crypto: 0.05
    - id: tier_3_established
      label: Established
      keying: horizon_over_10y_and_invested_wealth_over_5x_annual_core_expenses
      targets:
        sharia_equities: 0.55
        sukuk: 0.25
        sharia_money_market: 0.05
        gold: 0.10
        crypto: 0.05
    - id: tier_4_drawdown
      label: Drawdown / near retirement
      keying: withdrawal_or_retirement_within_5y
      targets:
        sharia_equities: 0.20
        sukuk: 0.45
        sharia_money_market: 0.25
        gold: 0.10
        crypto: 0.00
  caps:
    single_name_pct: 0.10
    single_name_excludes: diversified_funds_and_etfs
    single_sleeve_pct: 0.60
    crypto_target_pct: 0.05
    crypto_cap_pct: 0.10
    crypto_upper_trigger_pct: 0.15
    note: >
      Caps are risk controls, not compliance verdicts. The single-name cap
      applies to individual issuers, not to diversified funds or ETFs. Crypto
      permissibility is contested and is decided by the crypto skill; this cap
      only limits damage if it is held.
